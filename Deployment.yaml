apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      containers:
      - name: test
        image: us-central1-docker.pkg.dev/project-b7d113bc-47ff-4eb4-827/test-repo/test-app:44
        ports:
        - containerPort: 8080
